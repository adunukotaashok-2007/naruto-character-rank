<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Naruto Character Rank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #080808,
                    #1b1b1b,
                    #080808
                );
            color: white;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .screen {
            min-height: 100vh;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* =================================================
           HEADER
        ================================================= */

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 32px;
            color: #ff9800;
            text-shadow: 0 0 15px rgba(255, 152, 0, .5);
        }

        header p {
            margin-top: 8px;
            color: #bbb;
        }

        /* =================================================
           HOME
        ================================================= */

        .home-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding-top: 50px;
        }

        .panel {
            background: rgba(25, 25, 25, .95);
            border: 1px solid #333;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }

        .panel h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #bbb;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #111;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #ff9800;
        }

        .main-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            background: #ff9800;
            color: #111;
            font-weight: bold;
        }

        .main-button:hover {
            background: #ffb52e;
        }

        .secondary-button {
            width: 100%;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 13px;
            margin-top: 10px;
            background: #222;
            color: white;
        }

        .secondary-button:hover {
            background: #333;
        }

        /* =================================================
           ROOM
        ================================================= */

        .room-container {
            max-width: 900px;
            margin: auto;
        }

        .room-code {
            text-align: center;
            margin-bottom: 20px;
        }

        .room-code span {
            display: inline-block;
            margin-top: 8px;
            padding: 12px 25px;
            background: #111;
            border: 2px solid #ff9800;
            border-radius: 12px;
            font-size: 25px;
            letter-spacing: 4px;
            color: #ff9800;
            font-weight: bold;
        }

        .players {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .player-card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
        }

        .player-name {
            font-weight: bold;
            color: #ff9800;
        }

        .player-money {
            margin-top: 8px;
            color: #aaa;
        }

        /* =================================================
           GAME
        ================================================= */

        .game-container {
            max-width: 1100px;
            margin: auto;
        }

        .game-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .status-box {
            background: #151515;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 15px;
        }

        #categoryTitle {
            color: #ff9800;
            font-size: 26px;
            font-weight: bold;
        }

        #categoryNumber {
            color: #aaa;
        }

        #characterGrid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
        }

        .character-card {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    #242424,
                    #111
                );
            border: 1px solid #444;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            transition: .2s;
        }

        .character-card:hover {
            transform: translateY(-4px);
            border-color: #ff9800;
        }

        .character-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background: #222;
        }

        .rank-number {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
            padding: 5px 9px;
            border-radius: 8px;
            background: #111;
            color: #ff9800;
            font-weight: bold;
        }

        .character-name {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .best-badge {
            margin-top: 8px;
            padding: 6px;
            border-radius: 8px;
            background: #ff9800;
            color: #111;
            font-weight: bold;
        }

        /* =================================================
           AUCTION
        ================================================= */

        .auction-panel {
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        #auctionCharacter {
            font-size: 42px;
            color: #ff9800;
            margin: 20px 0;
        }

        #auctionBid {
            font-size: 25px;
            margin: 15px 0;
        }

        #auctionTimer {
            font-size: 45px;
            font-weight: bold;
            margin: 15px;
        }

        .auction-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .auction-buttons button {
            min-width: 150px;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }

        #bidButton {
            background: #ff9800;
            color: #111;
        }

        #giveUpButton {
            background: #b71c1c;
            color: white;
        }

        /* =================================================
           TEAM
        ================================================= */

        .team-panel {
            margin-top: 20px;
        }

        .team-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .team-character {
            background: #222;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 8px;
        }

        /* =================================================
           MESSAGES
        ================================================= */

        #message {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 1000;

            max-width: 90%;
            padding: 12px 18px;

            background: #222;
            border: 1px solid #555;
            border-radius: 10px;

            color: white;
            text-align: center;

            display: none;
        }

        #message.show {
            display: block;
        }

        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .screen {
                padding: 12px;
            }

            header h1 {
                font-size: 25px;
            }

            .panel {
                padding: 18px;
            }

            #categoryTitle {
                font-size: 21px;
            }

            #characterGrid {
                grid-template-columns:
                    repeat(2, 1fr);
                gap: 10px;
            }

            .character-card img {
                height: 150px;
            }

            .character-name {
                font-size: 15px;
            }

            #auctionCharacter {
                font-size: 30px;
            }

            #auctionTimer {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

<!-- =====================================================
     HOME SCREEN
===================================================== -->

<section
    id="homeScreen"
    class="screen"
>

    <div class="home-container">

        <header>
            <h1>🍥 NARUTO CHARACTER RANK</h1>
            <p>Multiplayer Ninja Ranking & Auction</p>
        </header>

        <div class="panel">

            <h2>Enter Game</h2>

            <div class="input-group">
                <label for="playerName">
                    Your Name
                </label>

                <input
                    id="playerName"
                    type="text"
                    placeholder="Enter your name"
                    maxlength="20"
                >
            </div>

            <div class="input-group">
                <label for="gameMode">
                    Game Mode
                </label>

                <select id="gameMode">

                    <option value="rank">
                        Character Rank
                    </option>

                    <option value="auction">
                        Character Auction
                    </option>

                </select>
            </div>

            <button
                id="createButton"
                class="main-button"
            >
                CREATE ROOM
            </button>

            <button
                id="showJoinButton"
                class="secondary-button"
            >
                JOIN ROOM
            </button>

            <div
                id="joinBox"
                class="hidden"
                style="margin-top:20px;"
            >

                <div class="input-group">

                    <label for="roomCodeInput">
                        Room Code
                    </label>

                    <input
                        id="roomCodeInput"
                        type="text"
                        placeholder="ABC123"
                        maxlength="6"
                    >

                </div>

                <button
                    id="joinButton"
                    class="main-button"
                >
                    JOIN ROOM
                </button>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     ROOM SCREEN
===================================================== -->

<section
    id="roomScreen"
    class="screen hidden"
>

    <div class="room-container">

        <header>

            <h1>🥷 GAME ROOM</h1>

            <p id="roomMode">
                Waiting for players...
            </p>

        </header>

        <div class="panel">

            <div class="room-code">

                <div>ROOM CODE</div>

                <span id="roomCodeDisplay">
                    ------
                </span>

            </div>

            <div
                id="playerCount"
                style="text-align:center;"
            >
                Players: 0
            </div>

            <div
                id="playersList"
                class="players"
            ></div>

            <button
                id="startGameButton"
                class="main-button"
            >
                START GAME
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     RANK SCREEN
===================================================== -->

<section
    id="rankScreen"
    class="screen hidden"
>

    <div class="game-container">

        <div class="game-top">

            <div class="status-box">

                <div id="categoryTitle">
                    🧠 BATTLE IQ
                </div>

                <div id="categoryNumber">
                    Category 1 / 16
                </div>

            </div>

            <div
                id="rankStatus"
                class="status-box"
            >
                Waiting...
            </div>

        </div>

        <div
            id="characterGrid"
        ></div>

    </div>

</section>


<!-- =====================================================
     AUCTION SCREEN
===================================================== -->

<section
    id="auctionScreen"
    class="screen hidden"
>

    <div class="auction-panel">

        <header>

            <h1>🔥 NARUTO AUCTION</h1>

            <p id="auctionCharacterNumber">
                Character 1
            </p>

        </header>

        <div class="panel">

            <div id="auctionCharacter">
                Waiting...
            </div>

            <div id="auctionTimer">
                0
            </div>

            <div id="auctionBid">
                Current Bid: ₹0
            </div>

            <div id="auctionHighest">
                Highest Bidder: Nobody
            </div>

            <div
                id="auctionMoney"
                style="margin:15px 0;"
            >
                Balance: ₹0
            </div>

            <div class="auction-buttons">

                <button id="bidButton">
                    BID
                </button>

                <button id="giveUpButton">
                    GIVE UP
                </button>

            </div>

        </div>

        <div class="panel team-panel">

            <h2>Your Team</h2>

            <div
                id="myTeam"
                class="team-list"
            ></div>

        </div>

    </div>

</section>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div id="message"></div>


<!-- =====================================================
     SOCKET.IO
===================================================== -->

<script src="/socket.io/socket.io.js"></script>


<!-- =====================================================
     CLIENT SCRIPT
===================================================== -->

<script>

    /* =====================================================
       SOCKET
    ===================================================== */

    const socket = io();


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const homeScreen =
        document.getElementById("homeScreen");

    const roomScreen =
        document.getElementById("roomScreen");

    const rankScreen =
        document.getElementById("rankScreen");

    const auctionScreen =
        document.getElementById("auctionScreen");

    const playerNameInput =
        document.getElementById("playerName");

    const gameModeSelect =
        document.getElementById("gameMode");

    const roomCodeInput =
        document.getElementById("roomCodeInput");

    const roomCodeDisplay =
        document.getElementById("roomCodeDisplay");

    const playersList =
        document.getElementById("playersList");

    const playerCount =
        document.getElementById("playerCount");

    const startGameButton =
        document.getElementById("startGameButton");

    const message =
        document.getElementById("message");


    /* =====================================================
       STATE
    ===================================================== */

    let myPlayerId = null;

    let currentRoomCode = null;

    let currentGameMode = "rank";

    let currentPlayers = [];

    let currentAuction = null;


    /* =====================================================
       SHOW SCREEN
    ===================================================== */

    function showScreen(screen) {

        homeScreen.classList.add("hidden");
        roomScreen.classList.add("hidden");
        rankScreen.classList.add("hidden");
        auctionScreen.classList.add("hidden");

        screen.classList.remove("hidden");
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(text) {

        message.textContent = text;

        message.classList.add("show");

        setTimeout(() => {
            message.classList.remove("show");
        }, 3000);
    }


    /* =====================================================
       CREATE ROOM
    ===================================================== */

    document
        .getElementById("createButton")
        .addEventListener(
            "click",
            () => {

                const name =
                    playerNameInput
                        .value
                        .trim();

                const gameMode =
                    gameModeSelect.value;

                if (!name) {

                    showMessage(
                        "Enter your name."
                    );

                    return;
                }

                socket.emit(
                    "createRoom",
                    {
                        name,
                        gameMode,

                        maxPlayers: 6,

                        teamSize: 5,

                        startingBalance: 1000,

                        bidAmount: 50,

                        bidTime: 10
                    }
                );

            }
        );


    /* =====================================================
       SHOW JOIN
    ===================================================== */

    document
        .getElementById("showJoinButton")
        .addEventListener(
            "click",
            () => {

                document
                    .getElementById("joinBox")
                    .classList
                    .toggle("hidden");

            }
        );


    /* =====================================================
       JOIN ROOM
    ===================================================== */

    document
        .getElementById("joinButton")
        .addEventListener(
            "click",
            () => {

                const name =
                    playerNameInput
                        .value
                        .trim();

                const roomCode =
                    roomCodeInput
                        .value
                        .trim()
                        .toUpperCase();

                if (!name) {

                    showMessage(
                        "Enter your name."
                    );

                    return;
                }

                if (!roomCode) {

                    showMessage(
                        "Enter room code."
                    );

                    return;
                }

                socket.emit(
                    "joinRoom",
                    {
                        name,
                        roomCode
                    }
                );

            }
        );


    /* =====================================================
       ROOM CREATED
    ===================================================== */

    socket.on(
        "roomCreated",
        data => {

            myPlayerId =
                socket.id;

            currentRoomCode =
                data.roomCode;

            currentGameMode =
                data.gameMode;

            roomCodeDisplay.textContent =
                data.roomCode;

            document
                .getElementById("roomMode")
                .textContent =
                    data.gameMode === "auction"
                    ? "🔥 Auction Mode"
                    : "🏆 Character Rank Mode";

            startGameButton
                .classList
                .remove("hidden");

            showScreen(roomScreen);

        }
    );


    /* =====================================================
       ROOM JOINED
    ===================================================== */

    socket.on(
        "roomJoined",
        data => {

            myPlayerId =
                socket.id;

            currentRoomCode =
                data.roomCode;

            currentGameMode =
                data.gameMode;

            roomCodeDisplay.textContent =
                data.roomCode;

            document
                .getElementById("roomMode")
                .textContent =
                    data.gameMode === "auction"
                    ? "🔥 Auction Mode"
                    : "🏆 Character Rank Mode";

            /*
             * Only host can see START GAME.
             */

            if (data.isHost) {

                startGameButton
                    .classList
                    .remove("hidden");

            } else {

                startGameButton
                    .classList
                    .add("hidden");

            }

            showScreen(roomScreen);

        }
    );


    /* =====================================================
       PLAYERS UPDATED
    ===================================================== */

    socket.on(
        "playersUpdated",
        data => {

            currentPlayers =
                data.players || [];

            playerCount.textContent =
                `Players: ${currentPlayers.length}`;

            playersList.innerHTML = "";

            currentPlayers.forEach(
                player => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "player-card";

                    card.innerHTML = `

                        <div class="player-name">
                            ${escapeHtml(
                                player.name
                            )}
                        </div>

                        <div class="player-money">
                            Balance:
                            ₹${player.balance}
                        </div>

                        <div class="player-money">
                            Team:
                            ${player.team.length}
                        </div>

                    `;

                    playersList
                        .appendChild(card);

                }
            );

        }
    );


    /* =====================================================
       START GAME
    ===================================================== */

    startGameButton
        .addEventListener(
            "click",
            () => {

                socket.emit(
                    "startGame"
                );

            }
        );


    /* =====================================================
       GAME STARTED
    ===================================================== */

    socket.on(
        "gameStarted",
        data => {

            currentGameMode =
                data.gameMode;

            if (
                data.gameMode ===
                "auction"
            ) {

                showScreen(
                    auctionScreen
                );

            } else {

                showScreen(
                    rankScreen
                );

            }

        }
    );


    /* =====================================================
       RANK CATEGORY
    ===================================================== */

    socket.on(
        "rankNextCategory",
        data => {

            showScreen(
                rankScreen
            );

            document
                .getElementById(
                    "categoryTitle"
                )
                .textContent =
                    data.categoryName;

            document
                .getElementById(
                    "categoryNumber"
                )
                .textContent =
                    `Category ${
                        data.categoryNumber
                    } / ${
                        data.totalCategories
                    }`;

            document
                .getElementById(
                    "rankStatus"
                )
                .textContent =
                    "Choose your character.";

        }
    );


    /* =====================================================
       RANK SELECTION
    ===================================================== */

    document
        .getElementById("characterGrid")
        .addEventListener(
            "click",
            event => {

                const card =
                    event.target.closest(
                        ".character-card"
                    );

                if (!card) return;

                const character =
                    card.querySelector(
                        ".character-name"
                    )?.textContent
                    ?.trim();

                if (!character) return;

                const categoryNumber =
                    document
                        .getElementById(
                            "categoryNumber"
                        )
                        .textContent
                        .match(/\d+/);

                const categoryIndex =
                    categoryNumber
                    ? Number(
                        categoryNumber[0]
                    ) - 1
                    : 0;

                socket.emit(
                    "rankSelect",
                    {
                        categoryIndex,
                        character
                    }
                );

                document
                    .getElementById(
                        "rankStatus"
                    )
                    .textContent =
                        `Selected: ${character}`;

            }
        );


    /* =====================================================
       RANK SELECTION MADE
    ===================================================== */

    socket.on(
        "rankSelectionMade",
        data => {

            if (
                data.playerId ===
                myPlayerId
            ) {
                return;
            }

            showMessage(
                `${data.playerName} selected ${data.character}`
            );

        }
    );


    /* =====================================================
       RANK WAITING
    ===================================================== */

    socket.on(
        "rankWaiting",
        data => {

            document
                .getElementById(
                    "rankStatus"
                )
                .textContent =
                    "Waiting for all players...";

        }
    );


    /* =====================================================
       RANK COMPLETE
    ===================================================== */

    socket.on(
        "rankCategoryComplete",
        data => {

            document
                .getElementById(
                    "rankStatus"
                )
                .textContent =
                    "✅ Everyone selected!";

        }
    );


    /* =====================================================
       RANK FINISHED
    ===================================================== */

    socket.on(
        "rankFinished",
        data => {

            document
                .getElementById(
                    "categoryTitle"
                )
                .textContent =
                    "🏆 RANKING COMPLETE";

            document
                .getElementById(
                    "categoryNumber"
                )
                .textContent =
                    "16 / 16 Categories";

            document
                .getElementById(
                    "rankStatus"
                )
                .textContent =
                    "🎉 Game Finished!";

        }
    );


    /* =====================================================
       AUCTION NEW CHARACTER
    ===================================================== */

    socket.on(
        "auctionNewCharacter",
        data => {

            showScreen(
                auctionScreen
            );

            document
                .getElementById(
                    "auctionCharacter"
                )
                .textContent =
                    data.character;

            document
                .getElementById(
                    "auctionCharacterNumber"
                )
                .textContent =
                    `Character ${
                        data.characterNumber
                    } / ${
                        data.totalCharacters
                    }`;

        }
    );


    /* =====================================================
       AUCTION UPDATE
    ===================================================== */

    socket.on(
        "auctionUpdated",
        data => {

            currentAuction =
                data;

            document
                .getElementById(
                    "auctionCharacter"
                )
                .textContent =
                    data.character || "Waiting...";

            document
                .getElementById(
                    "auctionBid"
                )
                .textContent =
                    `Current Bid: ₹${
                        data.currentBid || 0
                    }`;

            document
                .getElementById(
                    "auctionHighest"
                )
                .textContent =
                    `Highest Bidder: ${
                        data.highestBidderName ||
                        "Nobody"
                    }`;

            document
                .getElementById(
                    "auctionTimer"
                )
                .textContent =
                    data.remainingTime || 0;

        }
    );


    /* =====================================================
       AUCTION TIMER
    ===================================================== */

    socket.on(
        "auctionTimer",
        data => {

            document
                .getElementById(
                    "auctionTimer"
                )
                .textContent =
                    data.seconds;

        }
    );


    /* =====================================================
       AUCTION MONEY
    ===================================================== */

    socket.on(
        "auctionMoneyUpdated",
        data => {

            document
                .getElementById(
                    "auctionMoney"
                )
                .textContent =
                    `Balance: ₹${
                        data.balance
                    } | Spent: ₹${
                        data.spent
                    }`;

            const bidButton =
                document.getElementById(
                    "bidButton"
                );

            bidButton.disabled =
                !data.canBid;

            const giveUpButton =
                document.getElementById(
                    "giveUpButton"
                );

            giveUpButton.disabled =
                data.gaveUp;

        }
    );


    /* =====================================================
       BID
    ===================================================== */

    document
        .getElementById("bidButton")
        .addEventListener(
            "click",
            () => {

                socket.emit(
                    "bid"
                );

            }
        );


    /* =====================================================
       GIVE UP
    ===================================================== */

    document
        .getElementById("giveUpButton")
        .addEventListener(
            "click",
            () => {

                socket.emit(
                    "giveUp"
                );

            }
        );


    /* =====================================================
       AUCTION BID MADE
    ===================================================== */

    socket.on(
        "auctionBidMade",
        data => {

            showMessage(
                `${data.playerName} bid ₹${data.bid}`
            );

        }
    );


    /* =====================================================
       AUCTION SOLD
    ===================================================== */

    socket.on(
        "auctionSold",
        data => {

            showMessage(
                `🔥 ${data.character} sold to ${
                    data.winnerName
                } for ₹${data.price}`
            );

            updateTeam(
                data.winnerId,
                data.team
            );

        }
    );


    /* =====================================================
       AUCTION UNSOLD
    ===================================================== */

    socket.on(
        "auctionUnsold",
        data => {

            showMessage(
                `${data.character} was unsold`
            );

        }
    );


    /* =====================================================
       AUCTION FINISHED
    ===================================================== */

    socket.on(
        "auctionFinished",
        data => {

            showMessage(
                "🏆 AUCTION FINISHED!"
            );

            setTimeout(() => {

                showScreen(
                    roomScreen
                );

            }, 1500);

        }
    );


    /* =====================================================
       HOST CHANGED
    ===================================================== */

    socket.on(
        "hostChanged",
        data => {

            if (
                data.hostId ===
                socket.id
            ) {

                startGameButton
                    .classList
                    .remove("hidden");

                showMessage(
                    "👑 You are now the host."
                );

            }

        }
    );


    /* =====================================================
       ERROR
    ===================================================== */

    socket.on(
        "errorMessage",
        text => {

            showMessage(
                text
            );

        }
    );


    /* =====================================================
       CONNECTION
    ===================================================== */

    socket.on(
        "connect",
        () => {

            myPlayerId =
                socket.id;

            console.log(
                "Connected:",
                socket.id
            );

        }
    );


    socket.on(
        "disconnect",
        () => {

            showMessage(
                "Connection lost. Reconnecting..."
            );

        }
    );


    /* =====================================================
       UPDATE TEAM
    ===================================================== */

    function updateTeam(
        playerId,
        team
    ) {

        if (
            playerId !==
            myPlayerId
        ) {
            return;
        }

        const teamElement =
            document.getElementById(
                "myTeam"
            );

        teamElement.innerHTML = "";

        team.forEach(
            character => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "team-character";

                item.textContent =
                    character;

                teamElement
                    .appendChild(item);

            }
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            value;

        return div.innerHTML;
    }


    /* =====================================================
       INITIAL STATE
    ===================================================== */

    showScreen(
        homeScreen
    );

</script>

</body>
</html>
